<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>momentum.js</title>
    <script src="js/vendor/p5.min.js"></script>
    <script src="js/CSInterface.js"></script>
    <script src="js/vendor/acorn.min.js"></script>
    <link rel="stylesheet" href="js/ui/editor/editorSurface.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="js/ui/files/files.css" />
    <link rel="stylesheet" href="js/ui/effectCode.css" />
    <link rel="stylesheet" href="js/ui/tooltip.css" />
    <link rel="stylesheet" href="js/ui/console/console.css" />
  </head>
  <body class="panel-launch-pending">
    <div id="container">
      <div id="toolbar">
        <div class="toolbar-left">
          <button
            id="toggleFileList"
            class="icon-button toggle-file-list-button"
            aria-label="Collapse file list"
          >
            <i class="fas fa-bars"></i>
          </button>
          <button
            id="cancelEffectCode"
            class="icon-button effect-code-action effect-code-exit-button"
            aria-label="Exit Edit Code"
          >
            <span class="effect-code-button-label">Exit</span>
          </button>
          <button
            id="newFile"
            class="icon-button"
            aria-label="New file"
          >
            <i class="fas fa-plus"></i>
          </button>
          <button
            id="newFolder"
            class="icon-button"
            aria-label="New folder"
          >
            <i class="fas fa-folder-plus"></i>
          </button>
        </div>

        <div class="toolbar-center">
          <span id="current-filename"></span>
        </div>

        <div class="toolbar-right">
          <select
            id="renderModeSelect"
            class="run-mode-select"
            aria-label="Render mode"
          >
            <option value="vector">Vector</option>
            <option value="bitmap">Bitmap</option>
          </select>
          <button
            id="runEditorScript"
            class="icon-button"
            aria-label="Run code"
            hidden
          >
            <i class="fas fa-play"></i>
          </button>
          <button
            id="commitCodeCue"
            class="icon-button effect-code-action effect-code-keyframe-button"
            data-tooltip="Add Code keyframe"
            aria-label="Add Code keyframe"
          >
            <span class="effect-code-keyframe-diamond" aria-hidden="true"></span>
          </button>
          <button
            id="modifyBaseCode"
            class="icon-button effect-code-action effect-code-label-button"
            data-tooltip="Modify Base Code"
            aria-label="Modify Base Code"
          >
            <span class="effect-code-button-label">Base Code</span>
          </button>
        </div>
      </div>

      <div id="main-content">
        <div id="file-list"></div>

        <div id="right-panel">
          <div id="editor-container" tabindex="-1">
            <div id="editor"></div>
            <div id="image-container" hidden></div>
          </div>

          <div id="console-container">
            <div id="console-title">Console</div>
            <div id="console-output"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/ui/console/errorProtocol.js"></script>
    <script src="js/ui/console/consoleManager.js"></script>
    <script src="js/ui/timelineClock.js"></script>

    <script src="js/compiler/core/ast.js"></script>

    <script src="js/compiler/rewriters/callsiteInstrumentation.js"></script>
    <script src="js/compiler/rewriters/reservedData.js"></script>
    <script src="js/compiler/compilerPipeline.js"></script>
    <script src="js/plugin/bridge.js"></script>

    <script src="js/plugin/bitmap.js"></script>
